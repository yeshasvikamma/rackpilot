<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RackPilot — Facility Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1a2a; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    /* Top bar */
    #topbar { height: 56px; background: #12122a; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; }
    #topbar h1 { font-size: 20px; font-weight: 700; color: #00e676; letter-spacing: -0.5px; display: inline; }
    #topbar .subtitle { font-size: 12px; color: #4b5563; margin-left: 10px; }
    #topbar input { background: #1e1e3f; border: 1px solid #2a2d4a; color: #1a1a2a; padding: 8px 14px; border-radius: 6px; font-size: 13px; width: 260px; font-family: 'Inter', sans-serif; outline: none; }
    #topbar button { background: #00e676; color: #0d0d1a; border: none; padding: 8px 20px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; margin-left: 10px; font-family: 'Inter', sans-serif; }

    /* Main layout */
    #main { display: flex; flex: 1; overflow: hidden; }
    #left { width: 55%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    #right { width: 45%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid #e2e8f0; }

    /* Cards */
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
    .card-title { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: #4b5563; text-transform: uppercase; margin-bottom: 12px; }

    /* Pod sections */
    .pod-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; }
    .pod-label { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; color: #448aff; text-transform: uppercase; margin-bottom: 10px; }
    .rack-grid { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Rack cells */
    .rack { width: 76px; height: 48px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: monospace; font-size: 11px; font-weight: 700; cursor: default; transition: all 0.2s; border: 1px solid; }
    .healthy { background: #0d2418; border-color: #00e676; color: #00e676; }
    .violated { background: #2d0f0f; border-color: #ff4757; color: #ff4757; }
    .newly-violating { background: #2d0f0f; border-color: #ff4757; color: #ff4757; animation: pulse-glow 1.2s ease-in-out infinite; }
    .placed { background: #0d1a2d; border-color: #448aff; color: #448aff; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 6px rgba(255,71,87,0.4); } 50% { box-shadow: 0 0 18px rgba(255,71,87,0.9); } }

    /* Status badge */
    .badge { display: inline-block; padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; }
    .feasible { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid #00e676; }
    .infeasible { background: rgba(255,71,87,0.15); color: #ff4757; border: 1px solid #ff4757; }
    .error { color: #ff4757; }

    /* Pareto cards */
    .pareto-row { display: flex; gap: 10px; }
    .pareto-card { flex: 1; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; border-top-width: 3px; }
    .pareto-card:nth-child(1) { border-top-color: #00e676; }
    .pareto-card:nth-child(2) { border-top-color: #ffd740; }
    .pareto-card:nth-child(3) { border-top-color: #448aff; }
    .pareto-label { font-size: 11px; font-weight: 600; color: #1a1a2a; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pareto-spend { font-size: 18px; font-weight: 700; color: #1a1a2a; margin-bottom: 4px; }
    .pareto-meta { font-size: 10px; color: #1a1a2a; }

    /* Text panels */
    .panel-text { font-size: 13px; line-height: 1.7; color: #4b5563; white-space: pre-wrap; }
    .violation-item { padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #4b5563; }
    .violation-item:last-child { border-bottom: none; }
    .iis-block { background: #0d0d1a; border-radius: 6px; padding: 10px; font-size: 12px; color: #c8cad4; margin-bottom: 8px; }
    .iis-block:last-child { margin-bottom: 0; }
    .iis-constraints { font-family: monospace; color: #ffd740; font-size: 11px; margin-bottom: 4px; }
    .critique-text { font-size: 13px; line-height: 1.7; color: #4b5563; white-space: pre-wrap; border-left: 3px solid #ff4757; padding-left: 12px; }
    .ticket-text { font-size: 14px; font-weight: 600; color: #00e676; }
    .placement-item { font-size: 12px; color: #4b5563; padding: 4px 0; font-family: monospace; }
  </style>
</head>
<body>
  <div id="topbar">
    <div>
      <h1>RackPilot</h1>
      <span class="subtitle">Capacity Engineering Co-pilot</span>
    </div>
    <div>
      <input id="request-input" type="text" placeholder="place 8 GPU racks" />
      <button id="run-btn">Run</button>
    </div>
  </div>
  <div id="main">
    <div id="left">
      <div id="facility-board"></div>
    </div>
    <div id="right">
      <div class="card"><div class="card-title">Status</div><div id="status"></div></div>
      <div class="card"><div class="card-title">Placements</div><div id="placements"></div></div>
      <div class="card"><div class="card-title">Violations</div><div id="violations"></div></div>
      <div class="card"><div class="card-title">IIS</div><div id="iis"></div></div>
      <div class="card"><div class="card-title">Pareto Plans</div><div id="pareto" class="pareto-row"></div></div>
      <div class="card"><div class="card-title">Explanation</div><div id="explanation" class="panel-text"></div></div>
      <div class="card"><div class="card-title">Critique</div><div id="critique" class="critique-text"></div></div>
      <div class="card"><div class="card-title">Ticket</div><div id="ticket" class="ticket-text"></div></div>
    </div>
  </div>
  <script>
    const API = "http://127.0.0.1:8001/handle";
    const BODY = { request_id: "req_001", mode: "place_batch", sources: [] };
    const PODS = {
      A: ["r_101","r_102","r_103","r_104","r_105","r_106","r_107","r_108"],
      B: ["r_109","r_110","r_111","r_112","r_113","r_114","r_115","r_116"],
      C: ["r_117","r_118","r_119","r_120","r_121","r_122","r_123","r_124"],
    };

    function buildFacilityShell() {
      const board = document.getElementById("facility-board");
      board.innerHTML = "";
      for (const [pod, racks] of Object.entries(PODS)) {
        const section = document.createElement("div");
        section.className = "pod-card";
        section.innerHTML = `<div class="pod-label">Pod ${pod}</div>`;
        const grid = document.createElement("div");
        grid.className = "rack-grid";
        for (const id of racks) {
          const cell = document.createElement("div");
          cell.className = "rack healthy";
          cell.dataset.rackId = id;
          cell.textContent = id;
          grid.appendChild(cell);
        }
        section.appendChild(grid);
        board.appendChild(section);
      }
    }

    function render(data) {
      const r = data.result;
      // Rack styling uses facility_diff.newly_violating — independent of status
      const newly = new Set(r.facility_diff?.newly_violating ?? []);
      const violated = new Set((r.violations ?? []).map(v => v.rack_id));
      const placed = new Set((r.placements ?? []).map(p => p.rack_id));

      document.querySelectorAll(".rack").forEach(cell => {
        const id = cell.dataset.rackId;
        cell.className = "rack";
        if (newly.has(id)) cell.classList.add("newly-violating");
        else if (violated.has(id)) cell.classList.add("violated");
        else cell.classList.add("healthy");
        if (placed.has(id)) cell.classList.add("placed");
      });

      const statusEl = document.getElementById("status");
      const isFeasible = r.status === "feasible";
      statusEl.innerHTML = `<span class="badge ${isFeasible ? "feasible" : "infeasible"}">${isFeasible ? "FEASIBLE" : "INFEASIBLE"}</span>`;

      // All panels render regardless of feasible/infeasible status
      document.getElementById("placements").innerHTML = (r.placements ?? [])
        .map(p => `<div class="placement-item">${p.rack_id} → pod ${p.pod}, ${p.rack_enclosure}</div>`).join("") || '<div class="placement-item">None</div>';

      document.getElementById("violations").innerHTML = (r.violations ?? [])
        .map(v => `<div class="violation-item">${v.rack_id}, ${v.rule}: ${v.detail}</div>`).join("") || '<div class="violation-item">None</div>';

      const iisList = r.iis ?? [];
      document.getElementById("iis").innerHTML = iisList.length
        ? iisList.map(i => `<div class="iis-block"><div class="iis-constraints">[${i.constraints.join(", ")}]</div>${i.message}</div>`).join("")
        : "None";

      document.getElementById("pareto").innerHTML = (r.pareto_plans ?? [])
        .map(p => `<div class="pareto-card"><div class="pareto-label">${p.label}</div><div class="pareto-spend">$${p.new_spend_usd.toLocaleString()}</div><div class="pareto-meta">resilience ${p.resilience}<br>headroom ${p.future_headroom}</div></div>`).join("");

      document.getElementById("explanation").textContent = (data.explanation ?? "")
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/#{1,3} /g, '')
        .replace(/^- /gm, '• ');
      document.getElementById("critique").textContent = (data.critique ?? "")
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/#{1,3} /g, '')
        .replace(/^- /gm, '• ');
      document.getElementById("ticket").textContent = data.ticket ?? "";
    }

    async function load() {
      document.getElementById("status").innerHTML = '<span class="badge">LOADING...</span>';
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(BODY),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        render(await res.json());
      } catch (e) {
        document.getElementById("status").innerHTML = `<span class="error">Error: ${e.message}</span>`;
      }
    }

    buildFacilityShell();
    document.getElementById("run-btn").addEventListener("click", load);
    load();
  </script>
</body>
</html>
